services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro
      POSTGRES_DB: agroalerta
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
  backend:
    build: ./backend
    depends_on: [postgres, mongo]
    environment:
      PG_DSN: postgresql://agro:agro@postgres:5432/agroalerta
      MONGO_URI: mongodb://mongo:27017
      DUCKDB_PATH: /data/analytics.duckdb
      CULTURAS_CSV: /data/culturas.csv
    volumes: ["./data:/data"]
    ports: ["8000:8000"]
volumes:
  pgdata:
  mongodata:
